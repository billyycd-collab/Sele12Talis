<html lang="th">
<head>

<title>ราคาวัตถุดิบเกม &amp; คำนวณต้นทุนอาวุธ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f3ee; --card:#ffffff; --ink:#1c1b18; --muted:#6a6860; --line:#e2dfd4;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#dff3ef;
  --up:#b42318; --down:#067647; --warn:#9a5b00; --warn-soft:#fdf0d5;
  --ok-soft:#dff3e6; --input:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.06);
  --gold:#a16207; --baht:#1d4ed8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --card:#1e2026; --ink:#ecebe6; --muted:#a09e94; --line:#31333b;
    --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#12312d;
    --up:#ff8a7a; --down:#5fd694; --warn:#f3b45a; --warn-soft:#3a2d14;
    --ok-soft:#173424; --input:#16171c; --shadow:none; --gold:#f5c451; --baht:#8ab4ff;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --card:#1e2026; --ink:#ecebe6; --muted:#a09e94; --line:#31333b;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#12312d;
  --up:#ff8a7a; --down:#5fd694; --warn:#f3b45a; --warn-soft:#3a2d14;
  --ok-soft:#173424; --input:#16171c; --shadow:none; --gold:#f5c451; --baht:#8ab4ff;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:20px;margin:6px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.grow{flex:1;min-width:140px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,'Noto Sans Thai',monospace;font-size:13px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--up)}
.btn.sm{padding:4px 10px;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{color:var(--muted);font-size:13px}
.price-in{width:100px;text-align:right}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--down)}
.muted{color:var(--muted)}
small{font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
.cg{color:var(--gold)} .cb{color:var(--baht)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between}
.rname{font-weight:700;font-size:16px}
.rcost{text-align:right;font-variant-numeric:tabular-nums}
.rcost b{font-size:19px}
.inc{opacity:.65}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:6px 16px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{stroke:var(--accent);stroke-width:2;fill:none}
.ch-dot{fill:var(--accent)}
.ch-txt{fill:var(--muted);font-size:11px}
svg.chart{width:100%;height:auto;display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto;z-index:20}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:560px}
.irow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.irow input.n{flex:1;min-width:0}
.irow input.q{width:80px;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const pad2 = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr = () => dstr(new Date());
const addDays = (s,n) => { const [y,m,d] = s.split('-').map(Number); return dstr(new Date(y,m-1,d+n)); };
const fmt = n => (isFinite(n) ? Number(n).toLocaleString('th-TH',{maximumFractionDigits:2}) : '-');
const fmtD = d => `${+d.slice(8)}/${+d.slice(5,7)}/${String(+d.slice(0,4)+543).slice(2)}`;
const parseNum = s => { const t = String(s ?? '').trim(); if(t==='') return null; const v = Number(t.replace(/,/g,'')); return isFinite(v) ? v : null; };

const CUR = { g:{sym:'G', name:'เงินในเกม', cls:'cg'}, b:{sym:'฿', name:'เงินนอก (บาท)', cls:'cb'} };

function migrate(){
  if(!S.aliases || typeof S.aliases!=='object') S.aliases = {};
  if(!S.demand || typeof S.demand!=='object') S.demand = {};
  for(const id in S.prices){ const p = S.prices[id]; for(const d in p){ if(typeof p[d]==='number') p[d] = {b:p[d]}; } }
  S.recipes.forEach(r=>{
    if(!r.kind) r.kind = (r.cat||r.lv) ? 'gear' : 'mat';
    if(r.sell !== undefined){ if(r.sell!=='' && r.sellB===undefined) r.sellB = r.sell; delete r.sell; }
  });
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); if(o && Array.isArray(o.materials)) S = Object.assign({materials:[],prices:{},recipes:[],aliases:{},demand:{}}, o); }
  }catch(e){}
  migrate();
}
let warnedStorage = false;
function save(){
  if(mode==='static') return;
  if(mode==='shared'){ dirty=true; scheduleSync(); return; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(!warnedStorage){ warnedStorage = true; toast('เบราว์เซอร์บันทึกอัตโนมัติไม่ได้ — โปรดสำรองข้อมูลในแท็บ “นำเข้า / สำรอง”'); } }
}
const curKind = () => tab==='crafts' ? 'mat' : 'gear';
const matById = id => S.materials.find(m=>m.id===id);
const recById = id => S.recipes.find(r=>r.id===id);
const norm = s => String(s).trim().toLowerCase();
const matByName = n => S.materials.find(m=>norm(m.name)===norm(n));
const recByName = n => S.recipes.find(r=>norm(r.name)===norm(n));

/* ราคา ณ วันที่ ของสกุล c — ถ้าวันนั้นไม่มี ใช้ราคาล่าสุดก่อนหน้า */
function priceAt(mid, date, c){
  const p = S.prices[mid]; if(!p) return null;
  let best = null;
  for(const d in p){ if(d<=date && p[d][c]!==undefined && (best===null || d>best)) best = d; }
  return best===null ? null : {v:p[best][c], d:best};
}
function entries(mid, c){
  const p = S.prices[mid] || {};
  return Object.keys(p).sort().filter(d=>p[d][c]!==undefined).map(d=>({d, v:p[d][c]}));
}
function setPrice(mid, d, c, v){
  const p = (S.prices[mid] ||= {}); const e = (p[d] ||= {});
  if(v===null) delete e[c]; else e[c] = v;
  if(e.g===undefined && e.b===undefined) delete p[d];
}
function countPrices(c){ let n=0; for(const id in S.prices) for(const d in S.prices[id]) if(S.prices[id][d][c]!==undefined) n++; return n; }
function moveGtoB(){
  let n=0, k=0;
  for(const id in S.prices) for(const d in S.prices[id]){
    const e = S.prices[id][d];
    if(e.g!==undefined && e.b===undefined){ e.b = e.g; delete e.g; n++; }
  }
  S.recipes.forEach(r=>{ if(hasNum(r.sellG) && !hasNum(r.sellB)){ r.sellB = r.sellG; r.sellG = ''; k++; } });
  return {n,k};
}
function addMaterial(name, unit='', nick=''){
  const m = { id: uid(), name: name.trim(), unit: unit.trim(), nick: nick.trim() };
  S.materials.push(m); return m;
}

/* ============ cost calc (แยกสกุล G / ฿) ============ */
function calcRecipe(r, date, stack=[]){
  const tot = {g:0,b:0}, miss = {g:new Set(), b:new Set()}, lines = []; let cyc = false;
  for(const it of (r.items||[])){
    if(it.t==='m'){
      const m = matById(it.id); if(!m) continue;
      const unit={}, sub={}, d={}, ms={};
      for(const c of C2){
        const p = priceAt(m.id, date, c);
        unit[c] = p ? p.v : null; d[c] = p ? p.d : null; ms[c] = !p;
        sub[c] = p ? p.v*it.qty : 0; tot[c] += sub[c];
        if(!p) miss[c].add(m.name);
      }
      lines.push({t:'m', name:m.name, qty:it.qty, unit, sub, d, ms});
    } else {
      const c0 = recById(it.id); if(!c0) continue;
      if(c0.id===r.id || stack.includes(c0.id)){ cyc=true; lines.push({t:'r',name:c0.name,qty:it.qty,unit:{g:0,b:0},sub:{g:0,b:0},d:{},ms:{},cyc:true}); continue; }
      const res = calcRecipe(c0, date, [...stack, r.id]), y = c0.yield||1;
      const unit={}, sub={}, ms={}, dir={}, dd={};
      for(const c of C2){
        const dp = c0.noDirect ? null : priceAt(c0.id, date, c);   // ราคาตลาด/ราคาที่ระบุตรง ใช้แทนต้นทุนผลิต
        if(dp){ unit[c] = dp.v; dir[c] = true; dd[c] = dp.d; ms[c] = false; }
        else { unit[c] = res.total[c]/y; ms[c] = res.missing[c].length>0; res.missing[c].forEach(x=>miss[c].add(x)); }
        sub[c] = unit[c]*it.qty; tot[c] += sub[c];
      }
      if(res.cyc) cyc=true;
      lines.push({t:'r', name:c0.name, qty:it.qty, unit, sub, d:dd, ms, direct:dir, children:res.lines});
    }
  }
  return {total:tot, lines, missing:{g:[...miss.g], b:[...miss.b]}, cyc};
}
function depDates(r, seen=new Set()){
  const ds = new Set(); if(seen.has(r.id)) return ds; seen.add(r.id);
  for(const it of (r.items||[])){
    if(it.t==='m'){ for(const d in (S.prices[it.id]||{})) ds.add(d); }
    else { const c = recById(it.id); if(c){ for(const d in (S.prices[c.id]||{})) ds.add(d); depDates(c, seen).forEach(d=>ds.add(d)); } }
  }
  return ds;
}
function recipeHistory(r, c){
  const pts=[]; let last=null;
  for(const d of [...depDates(r)].sort()){
    const res = calcRecipe(r, d); if(res.missing[c].length) continue;
    const v = res.total[c]/(r.yield||1);
    if(last!==null && Math.abs(v-last)<1e-9) continue;
    pts.push({d,v}); last=v;
  }
  return pts;
}

/* ============ chart (step line, carry-forward) ============ */
function chart(points, endDate){
  if(!points.length) return '<div class="empty">ยังไม่มีข้อมูลราคา</div>';
  const W=640,H=200,pl=56,pr=14,pt=14,pb=28;
  const t = d => Date.UTC(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
  const lastD = points[points.length-1].d;
  const t0 = t(points[0].d), t1 = t(endDate > lastD ? endDate : lastD);
  const span = Math.max(t1-t0, 86400000);
  const vs = points.map(p=>p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(lo===hi){ lo = lo*0.9; hi = hi*1.1 || 1; }
  else { const pad=(hi-lo)*0.12; lo = Math.max(0, lo-pad); hi += pad; }
  const X = d => pl + (t(d)-t0)/span*(W-pl-pr);
  const Y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  let path='';
  points.forEach((p,i)=>{ path += i ? `H${X(p.d).toFixed(1)}V${Y(p.v).toFixed(1)}` : `M${X(p.d).toFixed(1)} ${Y(p.v).toFixed(1)}`; });
  path += `H${W-pr}`;
  let grid='';
  for(let i=0;i<=3;i++){
    const v = lo + (hi-lo)*i/3, y = Y(v);
    grid += `<line class="ch-grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ch-txt" x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const dots = points.length<=40 ? points.map(p=>`<circle class="ch-dot" cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5"><title>${fmtD(p.d)} : ${fmt(p.v)}</title></circle>`).join('') : '';
  const endLbl = endDate > lastD ? endDate : lastD;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟราคา">${grid}
    <path class="ch-line" d="${path}"/>${dots}
    <text class="ch-txt" x="${pl}" y="${H-8}">${fmtD(points[0].d)}</text>
    <text class="ch-txt" x="${W-pr}" y="${H-8}" text-anchor="end">${fmtD(endLbl)}</text></svg>`;
}

const isField = e => e && /^(INPUT|TEXTAREA|SELECT)$/.test(e.tagName);
function inputFocused(){ const a = document.activeElement; return !!(a && a!==document.body && $('#app').contains(a) && isField(a)); }
function busy(){ return pointerDown || (Date.now()-lastInteract) < 2500 || inputFocused(); }
function renderKeep(){
  const saved = {};
  document.querySelectorAll('#app [id]').forEach(e=>{ if(isField(e) && e.tagName!=='SELECT') saved[e.id] = e.value; });
  render();
  for(const id in saved){ const e = $('#'+id); if(e && saved[id]!=='') e.value = saved[id]; }
}
function safeRender(){ if(busy()){ pendingRender = true; return; } renderKeep(); }
setInterval(()=>{ if(pendingRender && !busy()){ pendingRender = false; renderKeep(); } }, 800);

/* ============ tab: prices ============ */
function diffHtml(m, c){
  const raw = draft[m.id]?.[c]; if(raw===undefined || String(raw).trim()==='') return '';
  const v = parseNum(raw); if(v===null) return '<span class="chip warn">ตัวเลขไม่ถูกต้อง</span>';
  const p = priceAt(m.id, priceDate, c); if(!p) return '<span class="chip">ราคาแรก</span>';
  const df = v-p.v; if(df===0) return '<span class="muted"><small>เท่าเดิม</small></span>';
  const pc = p.v ? (df/p.v*100) : 0;
  return `<small class="${df>0?'up':'down'}">${df>0?'▲':'▼'} ${fmt(Math.abs(df))} (${pc>0?'+':''}${pc.toFixed(1)}%)</small>`;
}
function pCell(m, c){
  const p = priceAt(m.id, priceDate, c), exact = p && p.d===priceDate;
  const st = !p ? '<span class="chip warn">ยังไม่มี</span>' : exact ? '<span class="chip ok">บันทึกแล้ว</span>' : `<span class="chip">เดิม ${fmtD(p.d)}</span>`;
  return `<td class="num"><b>${p?fmt(p.v):'-'}</b> ${st}${RO?'':`<br>
    <input class="price-in" inputmode="decimal" placeholder="${CUR[c].sym} ใหม่" data-in="pin" data-id="${m.id}" data-c="${c}" value="${esc(draft[m.id]?.[c] ?? '')}">
    <div id="df-${m.id}-${c}">${diffHtml(m,c)}</div>`}</td>`;
}

    <div class="stats">
      <div class="stat"><b>${fmt(cur)} ${sym(c)}${curInc?' <span class="chip warn">ไม่ครบ</span>':''}</b><span>ต้นทุนปัจจุบัน</span></div>
      <div class="stat"><b>${vs.length?fmt(Math.min(...vs)):'-'}</b><span>ต่ำสุด</span></div>

function lineCell(l, field, c){
  if(l.cyc) return '-';

  const car = field==='unit' && l.d && l.d[c] && l.d[c]!==calcDate;
  return `<span ${car?`title="ใช้ราคาเดิมจาก ${fmtD(l.d[c])}"`:''} class="${l.t==='r'&&l.ms[c]?'muted':''}">${fmt(l[field][c])} ${sym(c)}${car?'*':''}</span>`;
}
function renderLines(lines, depth=0){
  return lines.map(l=>{
    let row = `<tr class="${l.t==='r'?'sub':''}"><td style="padding-left:${8+depth*18}px">${l.t==='r'?'▸ ':''}${esc(l.name)}${l.direct&&(l.direct.g||l.direct.b)?` <span class="chip">ใช้ราคาตลาด ${['g','b'].filter(c=>l.direct[c]).map(c=>CUR[c].sym).join('/')}</span>`:''}${l.cyc?' <span class="chip warn">อ้างอิงวนลูป</span>':''}</td>
      <td class="num">${fmt(l.qty)}</td>

      <td class="num">${lineCell(l,'sub','g')}<br>${lineCell(l,'sub','b')}</td></tr>`;
    if(l.children) row += renderLines(l.children, depth+1);
    return row;
  }).join('');
}

function collectEd(){
  ed.name = $('#ed-name').value; ed.cat = $('#ed-cat')?.value ?? ed.cat; ed.lv = $('#ed-lv')?.value ?? ed.lv; ed.nick = $('#ed-nick')?.value ?? ed.nick;
  ed.yield = $('#ed-yield').value; ed.sellG = $('#ed-sg')?.value ?? ed.sellG; ed.sellB = $('#ed-sb')?.value ?? ed.sellB;
  ed.items = ed.items.map((_,i)=>({name:$('#ed-n-'+i).value, qty:$('#ed-q-'+i).value}));
}
function saveEd(){
  collectEd();
  const name = ed.name.trim();
  if(!name){ toast('กรุณาใส่ชื่อสูตร'); return; }
  const dup = recByName(name); if(dup && dup.id!==ed.id){ toast('มีสูตรชื่อนี้อยู่แล้ว'); return; }
  const y = parseNum(ed.yield) || 1;
  const items=[]; let created=0;
  for(const it of ed.items){
    const n = String(it.name).trim(); if(!n) continue;
    const q = parseNum(it.qty); if(q===null || q<=0){ toast(`จำนวนของ “${n}” ไม่ถูกต้อง`); return; }
    let m = matByName(n);
    if(m){ items.push({t:'m',id:m.id,qty:q}); continue; }
    const c = recByName(n);
    if(c && c.id!==ed.id){ items.push({t:'r',id:c.id,qty:q}); continue; }
    m = addMaterial(n); created++; items.push({t:'m',id:m.id,qty:q});
  }
  const g = ed.kind==='gear', sg = parseNum(ed.sellG), sb = parseNum(ed.sellB);
  const rec = { id: ed.id || uid(), kind: ed.kind, name, cat: g?String(ed.cat).trim():'', lv: g?(parseNum(ed.lv)||''):'', nick: (!g)?String(ed.nick||'').trim():'', yield:y,
                sellG: (g&&sg!==null)?sg:'', sellB: (g&&sb!==null)?sb:'', items };
  const idx = S.recipes.findIndex(r=>r.id===rec.id);
  if(idx>=0) S.recipes[idx]=rec; else S.recipes.push(rec);
  save(); $('#modal').innerHTML=''; ed=null; render();
  toast(created ? `บันทึกแล้ว · สร้างวัตถุดิบใหม่ ${created} รายการ (ยังไม่มีราคา)` : 'บันทึกสูตรแล้ว');
}

let topDate = null, demandHistItem = null;
function curPriceOf(id, date, c){
  const m = matById(id); if(m) return priceAt(id, date, c);
  const r = recById(id); if(!r) return null;
  const res = calcRecipe(r, date); if(res.missing[c].length) return null;
  return {v: res.total[c]/(r.yield||1), d:date};
}
function top10Price(list, c, date){
  return list.map(it=>({it, p:curPriceOf(it.id, date, c)})).filter(x=>x.p).sort((a,b)=>b.p.v-a.p.v).slice(0,10);
}
function priceTop10Card(title, list, c, date){
  const rows = top10Price(list, c, date);
  if(!rows.length) return `<div class="card"><h2>${esc(title)}</h2><div class="empty">ยังไม่มีราคาให้จัดอันดับ</div></div>`;
  const body = rows.map((x,i)=>`<tr><td class="num">${i+1}</td><td>${esc(x.it.name)}${x.it.nick?` <small class="muted">(${esc(x.it.nick)})</small>`:''}</td><td class="num"><b>${fmt(x.p.v)}</b> ${sym(c)}</td></tr>`).join('');
  return `<div class="card scroll"><h2>${esc(title)}</h2><table><thead><tr><th></th><th>รายการ</th><th class="num">ราคา</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function demandDates(){ const s = new Set(); for(const id in S.demand) for(const d in S.demand[id]) s.add(d); return [...s].sort(); }
function demandEntry(id, date){
  const e = (S.demand[id]||{})[date]; if(e===undefined || e===null) return null;
  if(typeof e==='number') return {c:e, a:null};
  if(Array.isArray(e.au)) return {c:e.c||0, a:e.au.length};
  return {c:e.c||0, a:(e.a!=null?e.a:null)};
}
function demandTop20(date){
  const rows = [];
  for(const id in S.demand){ const e = demandEntry(id, date); if(e && e.c) rows.push({id, count:e.c, authors:e.a}); }
  return rows.sort((a,b)=>b.count-a.count).slice(0,20);
}
function demandItemIds(){ return Object.keys(S.demand||{}).filter(id=>Object.keys(S.demand[id]||{}).length && itemById(id)); }
function demandSeries(id){
  const dates = Object.keys(S.demand[id]||{}).sort();
  return dates.map(d=>({d, v:demandEntry(id,d).c}));
}
function demandTrendCard(){
  const ids = demandItemIds();
  if(!ids.length) return '';
  if(!demandHistItem || !ids.includes(demandHistItem)) demandHistItem = ids.slice().sort((a,b)=>itemNm(a).localeCompare(itemNm(b),'th',{sensitivity:'base',numeric:true}))[0];
  const pts = demandSeries(demandHistItem), vs = pts.map(p=>p.v);
  const cur = vs.length ? vs[vs.length-1] : 0;
  const avg = vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : 0;
  const opts = ids.slice().sort((a,b)=>itemNm(a).localeCompare(itemNm(b),'th',{sensitivity:'base',numeric:true}))
    .map(id=>`<option value="${id}" ${id===demandHistItem?'selected':''}>${esc(itemNm(id))}</option>`).join('');
  return `<div class="card"><h2>แนวโน้มความต้องการซื้อรายวัน</h2>
    <p class="hint" style="margin-top:0">ดูว่าความต้องการของแต่ละรายการเพิ่มขึ้นหรือลดลงต่อเนื่องกี่วันแล้ว เหมือนแท็บ “ประวัติราคา”</p>

      <div class="stat"><b>${vs.length?fmt(Math.min(...vs)):'-'}</b><span>ต่ำสุด</span></div>
      <div class="stat"><b>${vs.length?fmt(Math.max(...vs)):'-'}</b><span>สูงสุด</span></div>
      <div class="stat"><b>${vs.length?fmt(avg):'-'}</b><span>เฉลี่ย</span></div>
    </div>
    ${pts.length>=2 ? chart(pts, todayStr()) : '<div class="empty">มีข้อมูลแค่วันเดียว — บันทึกความต้องการซื้อเพิ่มอีกสักวันเพื่อดูแนวโน้ม</div>'}</div>`;
}
function truncName(s, n){ s = String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function demandBarChart(rows){
  if(!rows.length) return '';
  const labelW = 148, barAreaW = 380, rowH = 26, gap = 6, padTop = 6, padBottom = 6;
  const W = labelW + barAreaW + 60;
  const H = padTop + rows.length*(rowH+gap) - gap + padBottom;
  const max = Math.max(...rows.map(r=>r.count), 1);
  const bars = rows.map((r,i)=>{
    const y = padTop + i*(rowH+gap);
    const bw = Math.max(2, (r.count/max)*barAreaW);
    const top3 = i<3;
    const name = truncName(itemNm(r.id), 20);
    return `<g>
      <text x="${labelW-8}" y="${y+rowH/2+4}" text-anchor="end" class="ch-txt" font-size="12">${esc(name)}</text>
      <rect x="${labelW}" y="${y}" width="${bw.toFixed(1)}" height="${rowH-4}" rx="4" fill="${top3?'var(--accent)':'var(--accent-soft)'}"><title>${esc(itemNm(r.id))}: ${r.count} ครั้ง${r.authors!=null?` จาก ${r.authors} คน`:''}</title></rect>
      <text x="${labelW+bw+8}" y="${y+rowH/2+4}" class="ch-txt" font-size="12" font-weight="${top3?'700':'400'}">${r.count}${r.authors!=null?` <tspan fill="currentColor" opacity=".6">(${r.authors} คน)</tspan>`:''}</text>
    </g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟความต้องการซื้อ">${bars}</svg>`;
}

const chatBuy = {text:'', date:todayStr(), rows:[], parsed:false, filterQ:''};
function buyDemandCounts(){
  const map = new Map();
  chatBuy.rows.filter(r=>r.itemId && r.on).forEach(r=>{
    const d = effDate(r, chatBuy.date);
    const k = r.itemId+'|'+d;
    const e = map.get(k) || {id:r.itemId, date:d, count:0, authors:new Set()};
    e.count++; if(r.author) e.authors.add(r.author);
    map.set(k, e);
  });
  return [...map.values()].sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : b.count-a.count);
}
function buyRes(){
  if(!chatBuy.parsed) return '';
  const cmpKnown = (a,b) => itemNm(a.itemId).localeCompare(itemNm(b.itemId), 'th', {sensitivity:'base', numeric:true});
  const cmpUnk = (a,b) => a.name.localeCompare(b.name, 'th', {sensitivity:'base', numeric:true});
  const known = chatBuy.rows.filter(r=>r.itemId), unk = chatBuy.rows.filter(r=>!r.itemId);
  const dm = buyDemandCounts();
  const multiDate = new Set(dm.map(x=>x.date)).size > 1;
  const top = multiDate ? dm : dm.slice(0,10);
  const detDates = buyDatesDetected();
  const q = norm(chatBuy.filterQ);
  const knownShown = known.filter(r=>!q || norm(itemNm(r.itemId)).includes(q) || norm(r.seg).includes(q)).sort(cmpKnown);
  const unkShown = unk.filter(r=>!q || norm(r.name).includes(q) || norm(r.seg).includes(q)).sort(cmpUnk);
  const krows = knownShown.map(r=>`<tr>
      <td><input type="checkbox" data-ch="bon" data-i="${r.i}" ${r.on?'checked':''}></td>
      ${multiDate?`<td><small class="muted">${r.date?fmtD(effDate(r, chatBuy.date)):'ไม่พบวันที่'}</small></td>`:''}
      <td>${esc(itemNm(r.itemId))} <span class="chip">${itemTypeLabel(r.itemId)}</span>${viaNote(r)}</td>
      <td><small class="muted">${esc(r.seg)}</small></td></tr>`).join('');
  const urows = unkShown.slice(0,UNK_CAP).map(r=>`<tr>
      <td><input type="checkbox" data-ch="bon" data-i="${r.i}" ${r.on?'checked':''}></td>

      <td><input list="dlItems" placeholder="พิมพ์ชื่อรายการของเรา" data-ch="bmap" data-i="${r.i}" style="min-width:150px"></td>
      <td><small class="muted">${esc(r.seg)}</small></td></tr>`).join('');
  return `<div class="card"><h2>ผลการวิเคราะห์แชทรับซื้อ</h2>
    <p class="hint" style="margin-top:0">พบบรรทัด ${chatBuy.rows.length} · ตรงกับรายการของเรา ${known.length} · ยังไม่รู้จัก ${unk.length}</p>

    ${known.length?(knownShown.length?`<div class="scroll"><table><thead><tr><th></th>${multiDate?'<th>วันที่</th>':''}<th>รายการ</th><th>ข้อความเดิม</th></tr></thead><tbody>${krows}</tbody></table></div>`:'<div class="empty">ไม่พบรายการที่ค้นหา</div>'):'<div class="empty">ยังไม่มีบรรทัดที่ตรงกับรายการของเรา — ดูส่วน “ยังไม่รู้จัก” ด้านล่าง</div>'}</div>
  <div class="card"><h2>ความต้องการซื้อจากแชทนี้${multiDate?'':' (Top 10)'}</h2>
    <p class="hint" style="margin-top:0">นับจากจำนวนบรรทัดที่ประกาศรับซื้อแต่ละรายการ (เฉพาะแถวที่ติ๊กไว้และจับคู่รายการแล้ว)</p>
    ${detDates.length>1?`<p class="hint"><span class="chip ok">ตรวจพบ ${detDates.length} วันที่ในข้อความนี้</span> ${detDates.map(fmtD).join(', ')} — แยกนับให้อัตโนมัติตามวันที่จริงของแต่ละข้อความ</p>`
      :(detDates.length===1 && detDates[0]!==(chatBuy.date||todayStr())?`<p class="hint"><span class="chip">พบวันที่ในข้อความ</span> ${fmtD(detDates[0])} — ใช้วันที่นี้แทนช่อง “วันที่ของข้อมูลนี้” ด้านบน</p>`:'')}
    ${top.length?`<div class="scroll"><table><thead><tr><th></th>${multiDate?'<th>วันที่</th>':''}<th>รายการ</th><th class="num">จำนวนครั้ง</th><th class="num">จำนวนคนพูดถึง</th></tr></thead><tbody>${top.map((x,i)=>`<tr><td class="num">${i+1}</td>${multiDate?`<td>${fmtD(x.date)}</td>`:''}<td>${esc(itemNm(x.id))}</td><td class="num"><b>${x.count}</b></td><td class="num">${x.authors.size||'-'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีรายการพร้อมบันทึก</div>'}

    ${unkShown.length?`<div class="scroll" style="margin-top:8px"><table><thead><tr><th></th><th>ชื่อที่จับได้ (แก้ได้)</th><th>จับคู่กับ</th><th>ข้อความเดิม</th></tr></thead><tbody>${urows}</tbody></table></div>`:'<div class="empty" style="margin-top:8px">ไม่พบรายการที่ค้นหา</div>'}

function bulkPrices(){
  const date = $('#bp-date').value || todayStr(), c = $('#bp-cur').value === 'b' ? 'b' : 'g';
  const lines = $('#bp-text').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let ok=0, created=0, bad=[];
  for(const ln of lines){
    const mt = ln.match(/^(.*?)[\s,:=\t]+([\d.,]+)\s*$/);
    const v = mt ? parseNum(mt[2]) : null;
    if(!mt || v===null || !mt[1].trim()){ bad.push(ln); continue; }
    let m = matByName(mt[1]); if(!m){ m = addMaterial(mt[1]); created++; }
    setPrice(m.id, date, c, v); ok++;
  }
  save(); render();
  toast(`นำเข้าราคา ${CUR[c].sym} ${ok} รายการ` + (created?` · สร้างใหม่ ${created}`:'') + (bad.length?` · อ่านไม่ได้ ${bad.length} บรรทัด`:''));
}
function parseItem(s){
  s = s.trim(); if(!s) return null;
  const mt = s.match(/^(.*?)(?:\s*[×*]\s*|\s+[xX]\s*|\s+)(\d+(?:\.\d+)?)$/);
  if(mt && mt[1].trim()) return {name:mt[1].trim(), qty:Number(mt[2])};
  return {name:s, qty:1};
}
function importRecipes(text, kind='gear'){
  const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const parsed=[]; let bad=0;
  for(const ln of lines){
    const i = ln.search(/[=：:]/);
    if(i<1){ bad++; continue; }
    const left = ln.slice(0,i).split('|').map(x=>x.trim());
    const name = left[0], cat = left[1]||'', lv = parseNum((left[2]||'').replace(/^lv\.?\s*/i,''));
    const items = ln.slice(i+1).split(/[,،、]/).map(parseItem).filter(Boolean);
    if(!name || !items.length){ bad++; continue; }
    parsed.push({name, items, cat, lv});
  }
  parsed.forEach(p=>{
    let r = recByName(p.name);
    if(!r){ r = {id:uid(), kind, name:p.name, cat:'', yield:1, sellG:'', sellB:'', items:[]}; S.recipes.push(r); }
    r.kind = kind;
    if(p.cat) r.cat = p.cat;
    if(p.lv!==null) r.lv = p.lv;
    p.rec = r;
  });
  let createdM=0;
  parsed.forEach(p=>{
    p.rec.items = p.items.map(it=>{
      const c = recByName(it.name);
      if(c && c.id!==p.rec.id) return {t:'r', id:c.id, qty:it.qty};
      let m = matByName(it.name); if(!m){ m = addMaterial(it.name); createdM++; }
      return {t:'m', id:m.id, qty:it.qty};
    });
  });
  return {n:parsed.length, createdM, bad};
}

/* แปลงตารางแบบวิกิ (Item / Lv. / Material / Recipe) ให้เป็นรูปแบบ “ชื่อ | หมวด | เลเวล = วัตถุดิบ x จำนวน” */
const normWikiName = s => String(s).replace(/\bZine\b/g,'Zinc').replace(/\s+/g,' ').trim();
function convertWikiTables(text, opt={}){
  const lines = String(text).split(/\r?\n/), out = [], notes = [];
  let tables = 0, i = 0;
  const cellsOf = l => l.split(/\t| {2,}/).map(x=>x.trim());
  const isHdr = l => /^\s*Item\b.*\bMaterial\b/i.test(l || '');
  const nextIdx = n => { let j = n+1; while(j<lines.length && !lines[j].trim()) j++; return j; };
  const QTY = /^[×xX*]\s*(\d+(?:\.\d+)?)$/;
  while(i < lines.length){
    const line = lines[i], t = line.trim(), j = nextIdx(i);
    if(t && !/\t/.test(line) && !/[=]/.test(t) && isHdr(lines[j])){
      const title = t, cat = title.replace(/\s+(?:[IVXLCDM]+|\d+)$/i,'').trim() || title;
      const setItems = []; let recipeName = '', k = j+1;
      while(k < lines.length){
        if(!lines[k].trim()){ if(setItems.length) break; k++; continue; }
        const c = cellsOf(lines[k]);
        if(c.length < 3 || !/^\d+$/.test(c[1])) break;
        const name = normWikiName(c[0]), lv = c[1], mats = []; let rec = '';
        c.slice(2).forEach(x=>{ if(!x) return; if(/\bRecipe\b/i.test(x)) rec = x; else mats.push(normWikiName(x)); });
        const q = lines[k+1] !== undefined ? cellsOf(lines[k+1]) : [];
        const hasQ = q.length > 1 && QTY.test(q[1] || '');
        const qtys = hasQ ? q.slice(1).filter(Boolean).map(x=>{ const m = x.match(QTY); return m ? Number(m[1]) : null; }) : [];
        if(!hasQ || qtys.length !== mats.length || qtys.includes(null)) notes.push(`${name}: จำนวน (×) ไม่ตรงกับจำนวนวัตถุดิบ — ใช้ ×1 ให้ช่องที่ขาด ควรตรวจอีกครั้ง`);
        if(rec) recipeName = rec;
        if(mats.length){
          out.push(`${name} | ${cat} | ${lv} = ${mats.map((m,n)=>`${m} x${(qtys[n]!==undefined && qtys[n]!==null)?qtys[n]:1}`).join(', ')}`);
          setItems.push(name);
        } else notes.push(`${name}: ไม่พบวัตถุดิบ`);
        k += hasQ ? 2 : 1;
      }
      if(setItems.length){
        out.push(`${title} | ${cat} | = ${setItems.map(n=>n+' x1').join(', ')}${(opt.withRecipe && recipeName) ? ', '+recipeName+' x1' : ''}`);
        if(recipeName) notes.push(`พบไอเทม Recipe: ${recipeName} — ${opt.withRecipe?'นับเป็นส่วนประกอบของชุดแล้ว (×1)':'ไม่นับในต้นทุน (ติ๊กช่อง “นับ Recipe” ถ้าต้องการรวม)'}`);
        tables++;
      }
      i = k; continue;
    }
    out.push(line); i++;
  }
  return {text: out.join('\n'), tables, notes};
}
let importNotes = [], gearWithRecipe = false;
function bulkRecipes(kind, id){
  let text = $(id).value, extra = '';
  importNotes = [];

  }
  const r = importRecipes(text, kind);
  save(); render(); toast(recipeMsg(r) + extra);
}

/* ============ shared store (db) ============
   materials/c0.. และ recipes/c0.. = ก้อนละหลายรายการ, prices/<materialId> = ประวัติราคาของวัตถุดิบนั้น, app/log = ประวัติการแก้ไข */
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
function wantDocs(){
  const m = new Map();
  chunk(S.materials,200).forEach((c,i)=>m.set(`materials/c${i}`, JSON.stringify({list:c})));
  chunk(S.recipes,40).forEach((c,i)=>m.set(`recipes/c${i}`, JSON.stringify({list:c})));
  if(S.aliases && Object.keys(S.aliases).length) m.set('aliases/c0', JSON.stringify({map:sortKeys(S.aliases)}));
  for(const id in S.demand){ const dd = S.demand[id]; if(dd && Object.keys(dd).length) m.set(`demand/${id}`, JSON.stringify({d:sortKeys(dd)})); }
  for(const id in S.prices){
    const p = S.prices[id], ds = Object.keys(p).sort(); if(!ds.length) continue;
    const o = {}; ds.forEach(d=>{ const e=p[d], x={}; if(e.g!==undefined) x.g=e.g; if(e.b!==undefined) x.b=e.b; o[d]=x; });
    m.set(`prices/${id}`, JSON.stringify({p:o}));
  }
  return m;
}
/* กันข้อมูลย้อนกลับ: สิ่งที่เพิ่งเขียนเอง (ยังไม่เห็น echo จากระบบกลาง) ให้ใช้ค่าของเราแทนค่าเก่าใน cache */
const recent = new Map();
function sortKeys(v){ if(Array.isArray(v)) return v.map(sortKeys); if(v && typeof v==='object'){ const r={}; Object.keys(v).sort().forEach(k=>{ r[k]=sortKeys(v[k]); }); return r; } return v; }
const canon = o => JSON.stringify(sortKeys(o));
function applyRemote(){
  const docs = new Map();
  for(const name of ['materials','recipes','prices','aliases','demand']) for(const d of cache[name]) docs.set(`${name}/${d.id}`, d.data);
  const now = Date.now();
  for(const [path,w] of [...recent]){
    if(now - w.at > 25000){ recent.delete(path); continue; }
    const cur = docs.get(path);
    if(w.del){ if(cur) docs.delete(path); else recent.delete(path); }
    else if(cur && canon(cur)===w.canon) recent.delete(path);
    else docs.set(path, JSON.parse(w.str));
  }
  const pick = name => [...docs.entries()].filter(([p])=>p.startsWith(name+'/')).map(([p,d])=>({id:p.slice(name.length+1), data:d}));
  const ord = (a,b)=> (+a.id.slice(1))-(+b.id.slice(1));
  /* ข้อมูลจาก snapshot ถูกล็อกไว้ (frozen) แก้ตรงๆ ไม่ได้ ต้องทำสำเนาก่อนจึงจะแก้/ลบได้ */
  const cl = o => JSON.parse(JSON.stringify(o));
  S = {
    materials: cl(pick('materials').sort(ord).flatMap(d=>d.data.list||[])),
    recipes: cl(pick('recipes').sort(ord).flatMap(d=>d.data.list||[])),
    prices: Object.fromEntries(pick('prices').map(d=>[d.id, cl(d.data.p||{})])),
    aliases: pick('aliases').reduce((a,d)=>Object.assign(a, cl(d.data.map||{})), {}),
    demand: Object.fromEntries(pick('demand').map(d=>[d.id, cl(d.data.d||{})]))
  };
  migrate();
  synced = wantDocs();
  const sig = sigOf(synced);
  if(sig === lastSig && mode==='shared' && ready && document.getElementById) return;
  lastSig = sig; safeRender();
}
const sigOf = m => canon([...m.entries()].map(([k,v])=>[k, JSON.parse(v)]));
function scheduleSync(){ syncState='saving'; setStatus(); clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 500); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function dbWrite(fn){
  for(let i=0;i<4;i++){
    try{ return await fn(); }
    catch(e){ if(e && (e.code==='resource_exhausted' || e.code==='unavailable') && i<3){ await sleep(900*(i+1)); continue; } throw e; }
  }
}
async function syncNow(){
  if(syncing){ syncAgain = true; return; }
  syncing = true; let failed = false;
  try{
    do{
      syncAgain = false;
      const want = wantDocs();
      let n = 0;
      for(const [path,str] of want){
        if(synced.get(path)===str) continue;
        await dbWrite(()=>db.doc(path).set(JSON.parse(str))); synced.set(path,str);
        recent.set(path,{at:Date.now(), str, canon:canon(JSON.parse(str))});
        if(++n>8) await sleep(60);
      }
      for(const path of [...synced.keys()]){
        if(want.has(path)) continue;
        await dbWrite(()=>db.doc(path).delete()); synced.delete(path);
        recent.set(path,{at:Date.now(), del:true});
      }
    } while(syncAgain);
  }catch(e){
    failed = true;
    if(e && e.code==='invalid_argument'){
      RO = true; dirty = false; syncState='idle'; toast('คุณไม่มีสิทธิ์แก้ไข — เป็นโหมดดูอย่างเดียว');
      syncing = false; applyRemote(); return;
    }
    syncState='error'; toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
  syncing = false;
  if(!failed){
    dirty = false; syncState='idle'; lastSig = sigOf(wantDocs());
    writeLog();
    if(needReload){ needReload=false; applyRemote(); } else setStatus();
  } else setStatus();
}
let needReload = false;
async function writeLog(){
  if(!lastAct) return;
  const text = (ACT_LABEL[lastAct] || 'แก้ไขข้อมูล') + (actNote ? ' · '+actNote : ''); lastAct=''; actNote='';
  try{
    const ref = db.doc('app/log'), snap = await ref.get();
    const items = (snap.exists && Array.isArray(snap.data().items)) ? JSON.parse(JSON.stringify(snap.data().items)) : [];
    items.unshift({at:new Date().toISOString(), by:myId, text});
    await ref.set({items:items.slice(0,40)});
  }catch(e){}
}
function onSnap(){
  if(!(got.materials && got.recipes && got.prices && got.aliases && got.demand)) return;
  ready = true;
  if(dirty){ needReload = true; return; }
  applyRemote();
}
function subscribeShared(){
  ['materials','recipes','prices','aliases','demand'].forEach(name=>{
    db.collection(name).onSnapshot(snap=>{
      cache[name] = snap.docs.map(d=>({id:d.id, data:d.data()})); got[name] = true; onSnap();
    }, e=>{ if(!ready){ ready=true; mode='shared'; toast('โหลดข้อมูลกลางไม่สำเร็จ'); render(); } });
  });
  db.doc('app/log').onSnapshot(snap=>{
    logItems = snap.exists && Array.isArray(snap.data().items) ? snap.data().items : [];
    if(ready && tab==='admin') safeRender();
  }, ()=>{});
  setTimeout(()=>{ if(!ready){ ready=true; got.materials=got.recipes=got.prices=got.aliases=got.demand=true; applyRemote(); } }, 9000);
}

      if(!dl){ actions.exportShow(); toast('ดาวน์โหลดตรงไม่ได้ในมุมมองนี้ — คัดลอกข้อความด้านล่างไปเก็บแทน'); return; }
      await dl.save({filename:`game-prices-${todayStr()}.json`, data: backupJson()});
    }catch(e){ if(!(e && e.code==='declined')) toast('บันทึกไฟล์ไม่สำเร็จ ลองใช้ “แสดงเป็นข้อความ”'); }
  },
  exportShow(){ const t=$('#bk-text'); t.value = backupJson(); t.focus(); t.select(); },
  async importText(){
    const raw = $('#bk-text').value.trim(); if(!raw){ toast('ยังไม่ได้วางข้อมูล'); return; }
    let o; try{ o = JSON.parse(raw); }catch(e){ toast('ข้อความไม่ใช่ JSON ที่ถูกต้อง'); return; }
    if(!await askConfirm('ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ ยืนยัน?','กู้คืน')) return;
    try{ applyBackup(o); toast('กู้คืนข้อมูลแล้ว'); }catch(e){ toast('รูปแบบข้อมูลสำรองไม่ถูกต้อง'); }
  },
  seed(){ const r = seedAll(); save(); render(); toast(recipeMsg(r)); },
  async example(){
    if(S.materials.length || S.recipes.length){ if(!await askConfirm('จะเพิ่มข้อมูลตัวอย่างเข้าไปในข้อมูลที่มีอยู่ ต้องการต่อไหม?','เพิ่ม')) return; }
    loadExample();
  },
  async wipe(){
    if(!await askConfirm('ลบข้อมูลทั้งหมด (วัตถุดิบ ราคา สูตร)? ย้อนกลับไม่ได้','ลบทั้งหมด')) return;
    S = {materials:[],prices:{},recipes:[],aliases:{},demand:{}}; draft={}; save(); render(); toast('ล้างข้อมูลแล้ว');
  }
};
const inputs = {
  pin(el){
    const id = el.dataset.id, c = el.dataset.c;
    (draft[id] ||= {})[c] = el.value;
    const m = matById(id), cell = $(`#df-${id}-${c}`); if(cell && m) cell.innerHTML = diffHtml(m, c);
    updDraftCount();
  },
  hq(el){
    histQ = el.value;
    const hm = histMatches();
    if(hm.length && !hm.some(m=>m.id===histMat)) histMat = hm[0].id;
    const pos = el.selectionStart ?? histQ.length;
    render();
    const e = $('#hq'); if(e){ e.focus(); try{ e.setSelectionRange(pos,pos); }catch(_){} }
  },
  ctext(el){ chat.text = el.value; },
  btext(el){ chatBuy.text = el.value; },
  cq(el){
    chat.filterQ = el.value;
    const pos = el.selectionStart ?? chat.filterQ.length;
    refreshChat();
    const e = $('#cq'); if(e){ e.focus(); try{ e.setSelectionRange(pos,pos); }catch(_){} }
  },
  bq(el){
    chatBuy.filterQ = el.value;
    const pos = el.selectionStart ?? chatBuy.filterQ.length;
    refreshBuy();
    const e = $('#bq'); if(e){ e.focus(); try{ e.setSelectionRange(pos,pos); }catch(_){} }
  },
  pq(el){ priceQ = el.value; $('#ptable').innerHTML = pRows(); },
  mq(el){
    matQ = el.value;
    const pos = el.selectionStart ?? matQ.length;
    render();
    const e = $('#mq'); if(e){ e.focus(); try{ e.setSelectionRange(pos,pos); }catch(_){} }
  },
  aliasq(el){
    aliasQ = el.value;
    const pos = el.selectionStart ?? aliasQ.length;
    render();
    const e = $('#aliasq'); if(e){ e.focus(); try{ e.setSelectionRange(pos,pos); }catch(_){} }
  },
  rq(el){ recipeQ = el.value; $('#rlist').innerHTML = rList(); }
};
const changes = {
  gval(el){
    const k = el.dataset.k, raw = el.value.trim();
    if(raw==='') delete chatValOverride[k]; else chatValOverride[k] = Number(raw);
    refreshChat();
  },
  aliasRemap(el){
    const k = el.dataset.k, v = el.value.trim();
    if(!v) return;
    const it = matByName(v) || recByName(v);
    if(!it){ toast('ไม่พบชื่อนี้ในรายการของเรา — เลือกจากรายการที่ขึ้นมา'); return; }
    S.aliases[k] = it.id; save(); render(); toast(`แก้ “${k}” ให้จับคู่กับ ${it.name} แล้ว`);
  },
  pmiss(el){ priceMiss = el.checked; render(); },
  grecipe(el){ gearWithRecipe = el.checked; },
  topdate(el){ topDate = el.value; $('#app').innerHTML = vTop(); },
  demandHist(el){ demandHistItem = el.value; $('#app').innerHTML = vTop(); },
  cdate2(el){ chat.date = el.value || todayStr(); refreshChat(); },
  cdef(el){ chat.defCur = el.value; refreshChat(); },
  cmeth(el){ chat.method = el.value; refreshChat(); },
  ron(el){ const r = chat.rows[+el.dataset.i]; if(r){ r.on = el.checked; refreshChat(); } },
  rcur(el){ const r = chat.rows[+el.dataset.i]; if(r){ r.cur = el.value || null; refreshChat(); } },
  rdz(el){ const r = chat.rows[+el.dataset.i]; if(r){ r.dozen = el.checked; refreshChat(); } },
  rname(el){ const r = chat.rows[+el.dataset.i]; if(r) r.name = el.value.trim(); },
  bdate(el){ chatBuy.date = el.value || todayStr(); refreshBuy(); },
  bon(el){ const r = chatBuy.rows[+el.dataset.i]; if(r){ r.on = el.checked; refreshBuy(); } },
  bname(el){ const r = chatBuy.rows[+el.dataset.i]; if(r) r.name = el.value.trim(); },
  bmap(el){
    const r = chatBuy.rows[+el.dataset.i]; if(!r) return;
    const v = el.value.trim();
    if(!v){ r.itemId = null; r.mapped = false; refreshBuy(); return; }
    const it = matByName(v) || recByName(v);
    if(!it){ toast('ไม่พบชื่อนี้ในรายการของเรา — เลือกจากรายการที่ขึ้นมา'); return; }
    r.itemId = it.id; r.mapped = true; refreshBuy();
  },
  rmap(el){
    const r = chat.rows[+el.dataset.i]; if(!r) return;
    const v = el.value.trim();
    if(!v){ r.itemId = null; r.mapped = false; refreshChat(); return; }
    const it = matByName(v) || recByName(v);
    if(!it){ toast('ไม่พบชื่อนี้ในรายการของเรา — เลือกจากรายการที่ขึ้นมา'); return; }
    r.itemId = it.id; r.mapped = true; refreshChat();
  },
  pdate(el){ priceDate = el.value || todayStr(); render(); },
  cdate(el){ calcDate = el.value || todayStr(); render(); },
  hmat(el){ histMat = el.value; render(); },
  hedit(el){
    const c = el.dataset.c, raw = el.value.trim();
    if(raw===''){ setPrice(histMat, el.dataset.d, c, null); }
    else { const v = parseNum(raw); if(v===null||v<0){ toast('ราคาไม่ถูกต้อง'); render(); return; } setPrice(histMat, el.dataset.d, c, v); }
    save(); render(); toast('แก้ไขแล้ว');
  },
  edkind(el){ collectEd(); ed.kind = el.value; renderModal(); },
  mname(el){
    const m = matById(el.dataset.id), n = el.value.trim();
    if(!n){ toast('ชื่อห้ามว่าง'); render(); return; }
    const dup = matByName(n); if(dup && dup.id!==m.id){ toast('มีชื่อนี้แล้ว'); render(); return; }
    m.name = n; save(); toast('เปลี่ยนชื่อแล้ว');
  },
  munit(el){ matById(el.dataset.id).unit = el.value.trim(); save(); },
  mnick(el){ matById(el.dataset.id).nick = el.value.trim(); save(); },
  importFile(el){
    const f = el.files && el.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = async ()=>{
      try{
        const o = JSON.parse(rd.result);
        if(!await askConfirm('ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ด้วยไฟล์นี้ ยืนยัน?','กู้คืน')) return;
        applyBackup(o); toast('กู้คืนข้อมูลแล้ว');
      }catch(e){ toast('ไฟล์สำรองไม่ถูกต้อง'); }
    };
    rd.readAsText(f);
  }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, f = actions[a]; if(!f) return;
  if(WRITE.has(a)){ if(RO){ toast('ต้องเป็นแอดมินจึงจะแก้ไขได้'); return; } lastAct = a; }
  f(el, e);
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-in]'); if(el && inputs[el.dataset.in]) inputs[el.dataset.in](el, e);
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-ch]'); if(!el || !changes[el.dataset.ch]) return;
  const k = el.dataset.ch;
  if(WRITE_CH.has(k)){ if(RO){ toast('ต้องเป็นแอดมินจึงจะแก้ไขได้'); return; } lastAct = k; }
  changes[k](el, e);
});
// เหตุการณ์ 'toggle' ของ <details> ไม่ bubble ต้องดักที่ capture phase เพื่อจำว่าผู้ใช้เปิดกล่อง "ยังไม่รู้จัก" ไว้ไหม
document.addEventListener('toggle', e=>{
  const dt = e.target && e.target.dataset && e.target.dataset.dt;
  if(dt==='unk-sell') unkOpenSell = e.target.open;
  else if(dt==='unk-buy') unkOpenBuy = e.target.open;
}, true);
['pointerdown','mousedown','touchstart'].forEach(t=>document.addEventListener(t, ()=>{ pointerDown = true; lastInteract = Date.now(); }, true));
['pointerup','mouseup','touchend','pointercancel','click'].forEach(t=>document.addEventListener(t, ()=>{ pointerDown = false; lastInteract = Date.now(); }, true));
['keydown','input'].forEach(t=>document.addEventListener(t, ()=>{ lastInteract = Date.now(); }, true));
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.in==='pin'){
    e.preventDefault();
    const all = [...document.querySelectorAll('[data-in="pin"]')], i = all.indexOf(e.target);
    if(all[i+1]) all[i+1].focus(); else e.target.blur();
  }
});

async function boot(){
  const snapEl = document.getElementById && document.getElementById('snapshot');
  if(snapEl){
    try{
      const o = JSON.parse(snapEl.textContent);
      S = {materials:o.materials||[], prices:o.prices||{}, recipes:o.recipes||[], aliases:o.aliases||{}, demand:o.demand||{}};
      migrate(); snapAt = o.at || null; mode = 'static'; RO = true; render(); return;
    }catch(e){}
  }
  load();
  localBackup = (S.materials.length || S.recipes.length) ? JSON.parse(JSON.stringify(S)) : null;
  render();
  let dbNs = null, u = null;
  try{ if(window.claude && claude.use){ [dbNs,u] = await Promise.all([claude.use('db'), claude.use('user')]); } }catch(e){}
  if(!dbNs){
    mode = 'local'; RO = false;
    if(!S.materials.length && !S.recipes.length){ seedAll(); save(); }
    render(); return;
  }
  db = dbNs; userNs = u;
  S = {materials:[],prices:{},recipes:[],aliases:{},demand:{}};
  if(u){ try{ [canEditFlag, isOwnerFlag, myId] = await Promise.all([u.canEdit(), u.isOwner(), u.id()]); }catch(e){} }
  RO = (canEditFlag === false);
  mode = 'shared';
  subscribeShared();
}
boot();
</script>
